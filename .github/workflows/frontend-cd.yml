name: CD - Deploy Frontend to AKS

on:
  workflow_dispatch:
    inputs:
      product_api_ip:
        description: 'External URL of Product Service (e.g., http://X.X.X.X:8000)'
        required: true
        default: 'http://<ip_address>:8000'
      order_api_ip:
        description: 'External URL of Order Service (e.g., http://Y.Y.Y.Y:8001)'
        required: true
        default: 'http://<ip_address>:8001'
      aks_cluster_name:
        description: 'AKS name'
        required: true
        default: 'sit722-wk8-aks'
      aks_resource_group:
        description: 'AKS resource group'
        required: true
        default: 'sit722-wk8-rg'

  workflow_call:
    inputs:
      product_api_ip:   { required: true, type: string }
      order_api_ip:     { required: true, type: string }
      aks_cluster_name: { required: true, type: string }
      aks_resource_group: { required: true, type: string }

jobs:
  deploy_frontend:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Inject Backend IPs into Frontend main.js
        run: |
          sed -i "s|_PRODUCT_API_URL_|${{ inputs.product_api_ip }}|g" frontend/main.js
          sed -i "s|_ORDER_API_URL_|${{ inputs.order_api_ip }}|g" frontend/main.js
          echo "Updated frontend/main.js:"
          cat frontend/main.js

      - name: Build and Push Frontend Image
        env:
          REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}   # e.g., sit722wk8acr.azurecr.io
        run: |
          docker build -t $REGISTRY/frontend:latest ./frontend
          docker push $REGISTRY/frontend:latest

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ inputs.aks_resource_group }}
          cluster-name:  ${{ inputs.aks_cluster_name }}

      - name: Deploy Frontend to AKS
        run: |
          cd k8s
          kubectl apply -f frontend.yaml

      - name: Logout
        run: az logout
