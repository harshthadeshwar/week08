name: CD - Deploy Backend Services to AKS

on:
  workflow_dispatch:
    inputs:
      aks_cluster_name:
        description: 'Name of the AKS Cluster to deploy to'
        required: true
        default: 'sit722-wk8-aks'
      aks_resource_group:
        description: 'Resource Group of the AKS Cluster'
        required: true
        default: 'sit722-wk8-rg'
      aks_acr_name:
        description: 'Name of ACR (no domain, e.g., sit722wk8acr)'
        required: true
        default: 'sit722wk8acr'
      product_svc_name:
        description: 'K8s Service name for Product'
        required: true
        default: 'product-service'
      order_svc_name:
        description: 'K8s Service name for Order'
        required: true
        default: 'order-service'

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    environment: Production

    outputs:
      PRODUCT_API_IP: ${{ steps.get_product_ip.outputs.external_ip }}
      ORDER_API_IP:   ${{ steps.get_order_ip.outputs.external_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Kubernetes context (get AKS credentials)
        run: |
          az aks get-credentials \
            --resource-group "${{ github.event.inputs.aks_resource_group }}" \
            --name "${{ github.event.inputs.aks_cluster_name }}" \
            --overwrite-existing

      - name: Attach ACR
        run: |
          az aks update \
            --name "${{ github.event.inputs.aks_cluster_name }}" \
            --resource-group "${{ github.event.inputs.aks_resource_group }}" \
            --attach-acr "${{ github.event.inputs.aks_acr_name }}"

      - name: Deploy Backend Infrastructure (Namespace, ConfigMaps, Secrets, Databases)
        run: |
          cd k8s
          kubectl apply -f configmaps.yaml
          kubectl apply -f secrets.yaml
          kubectl apply -f product-db.yaml
          kubectl apply -f order-db.yaml

      - name: Deploy Backend Microservices (Product, Order)
        run: |
          cd k8s
          kubectl apply -f product-service.yaml
          kubectl apply -f order-service.yaml

      - name: Wait for Backend LoadBalancer IPs
        run: |
          PRODUCT_SVC="product-service"
          ORDER_SVC="order-service"

          echo "Waiting up to 5 minutes for LoadBalancer IPs..."
          for i in $(1..60); do
            P_IP=$(kubectl get svc "$PRODUCT_SVC" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            O_IP=$(kubectl get svc "$ORDER_SVC" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            echo "Attempt $i: Product=$P_IP Order=$O_IP"
            if [[ -n "$P_IP" && -n "$O_IP" ]]; then
              echo "All backend LoadBalancer IPs assigned!"
              echo "PRODUCT_IP=$P_IP" >> $GITHUB_ENV
              echo "ORDER_IP=$O_IP" >> $GITHUB_ENV
              break
            fi
            sleep 5
          done

            if [[ -z "$P_IP" || -z "$O_IP" ]]; then
            echo "Error: One or more LoadBalancer IPs not assigned."
            exit 1
          fi

      - id: get_product_ip
        run: echo "external_ip=${{ env.PRODUCT_IP }}" >> $GITHUB_OUTPUT

      - id: get_order_ip
        run: echo "external_ip=${{ env.ORDER_IP }}" >> $GITHUB_OUTPUT

      - name: Logout from Azure
        run: az logout
